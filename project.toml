[project]
name = "non-sidereal-imaging-pipeline"
version = "0.1.0"
description = "MeerKAT calibration and non-sidereal imaging pipeline."
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "stimela",
    "cult-cargo",
    "prepkat",
    "python-casacore",
    "pyyaml",
]

[project.urls]
Repository = "https://github.com/Ntsikelelo-Charles/Non-sidereal-imaging-pipeline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

dependencies = [
    "stimela",
    "cult-cargo",
    "prepkat @ git+ssh://git@github.com/JSKenyon/PrepKAT.git",
    "python-casacore",
    "pyyaml",
]
